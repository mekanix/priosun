[package]
name = "priosun"
version = "0.0.2"
edition = "2024"
default-run = "priosun"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
toml = "1.2.1"
anyhow = "1"
libc = "0.2"
tracing = "0.1"
tracing-subscriber = "0.3"
nvtree = "0.0.6"
jail = "0.3.1"
tabled = "0.22"
